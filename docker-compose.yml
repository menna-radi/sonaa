version: '3.8'

services:
  sonaa-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://srv1770369.hstgr.cloud:3000/api/v1}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-10000}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    container_name: sonaa_dashboard
    restart: unless-stopped
    ports:
      - "8085:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
